  <path d="M 620 1145 l -9 -4.5 l 0 9 z" fill="#4E7A35"/>
  <text x="502.5" y="1161" class="sub" text-anchor="middle">not ready → 409 · 9 stacking caps</text>
  <text x="399" y="1186" class="label" fill="#4E7A35" text-anchor="start">limits</text>
  <line x1="620" y1="1195" x2="389" y2="1195" stroke="#4E7A35" stroke-width="1.3" stroke-dasharray="5 4"/>
  <path d="M 385 1195 l 9 -4.5 l 0 9 z" fill="#4E7A35"/>
  <text x="399" y="1211" class="sub" text-anchor="start">sets · reps · hold · count · difficulty · categories</text>
  <text x="790" y="1236" class="label" fill="#9A6A2C" text-anchor="middle">getCandidates()</text>
  <line x1="385" y1="1245" x2="1191" y2="1245" stroke="#9A6A2C" stroke-width="1.8"/>
  <path d="M 1195 1245 l -9 -4.5 l 0 9 z" fill="#9A6A2C"/>
  <text x="790" y="1261" class="sub" text-anchor="middle">region · equipment · level · category · aggravators</text>
  <text x="790" y="1286" class="label" fill="#9A6A2C" text-anchor="middle">≤ 20 candidates, order by random()</text>
  <line x1="1195" y1="1295" x2="389" y2="1295" stroke="#9A6A2C" stroke-width="1.3" stroke-dasharray="5 4"/>
  <path d="M 385 1295 l 9 -4.5 l 0 9 z" fill="#9A6A2C"/>
  <text x="790" y="1311" class="sub" text-anchor="middle">with tags: primaryMuscles · category · force</text>
  <rect x="239.85" y="1336" width="290.3" height="58" rx="7" class="note"/>
  <text x="385" y="1352" class="file" text-anchor="middle">models/regimes.ts</text>
  <text x="385" y="1369" class="name" text-anchor="middle">create()</text>
  <text x="385" y="1385" class="sub" text-anchor="middle">fewer than count.min → 409 TooFewCandidates</text>
  <text x="702.5" y="1464" class="label" fill="#2B8584" text-anchor="middle">proposeRegime()</text>
  <line x1="385" y1="1473" x2="1016" y2="1473" stroke="#2B8584" stroke-width="1.8"/>
