<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 870" role="img" aria-label="Rebound architecture: the client's page.tsx posts a muscle name to lib/api.ts to create a regime, or gets, puts and deletes one by id. The controller validates each request and routes it to models/regimes.ts, which for create asks the exercises model to map the region to muscles via a cached region_muscles table, query Postgres for candidates, and ask Gemini to pick three with sets and reps, then saves the regime and its items in one transaction. Lookup reads that saved snapshot straight back out, update replaces the saved exercises in a transaction and resolves their names server-side, and delete removes the regime, with its items cascading. Neither lookup, update nor delete calls Gemini. Boxes are tagged with their MVC role: view, controller, or model, and list each file's key functions.">
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono       { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .bg         { fill: #121210; }
    .box        { fill: none; stroke: #EBE9DC; stroke-width: 1.5; }
    .div        { stroke: #38372F; stroke-width: 1; }
    .title      { font-weight: 700; font-size: 14px; fill: #EBE9DC; }
    .sub        { font-size: 10.5px; fill: #7A786C; }
    .body       { font-size: 11px; fill: #A9A79A; }
    .bold       { font-weight: 700; fill: #EBE9DC; }
    .tag        { font-weight: 600; font-size: 10.5px; }
    .legend     { font-size: 11px; fill: #A9A79A; }
    .arrow      { font-size: 20px; fill: #EBE9DC; }
    .conn-label { font-size: 9.5px; fill: #A9A79A; }
    .pipe-tag   { font-size: 9.5px; letter-spacing: 1px; fill: #7A786C; }
    .pipe-code  { font-size: 11px; fill: #EBE9DC; }
    .client { fill: #8C99F2; }
    .server { fill: #4FBBA8; }
    .db     { fill: #D290C6; }
    .ai     { fill: #E08B5F; }
  </style>

  <rect class="bg" x="0" y="0" width="1160" height="870"/>

  <!-- legend -->
  <text class="legend mono" x="40" y="30">mvc <tspan class="client tag">[view]</tspan> client-side ui  &#183;  <tspan class="server tag">[controller]</tspan> routing &amp; validation  &#183;  <tspan class="db tag">[model]</tspan> business logic &amp; data access  &#183;  functions named per file</text>
  <line class="div" x1="40" y1="44" x2="1120" y2="44"/>

  <!-- CLIENT -->
  <rect class="box" x="40" y="54" width="1080" height="166" rx="2"/>
  <text class="title client mono" x="60" y="74">apps/client &#8212; next.js</text>
  <text class="sub mono" x="1100" y="74" text-anchor="end">localhost:3000</text>
  <line class="div" x1="40" y1="86" x2="1120" y2="86" stroke="#EBE9DC" stroke-width="1.5"/>
  <line class="div" x1="320" y1="86" x2="320" y2="220"/>
  <line class="div" x1="780" y1="86" x2="780" y2="220"/>

  <text class="bold mono" x="60" y="108">layout.tsx <tspan class="client tag">[view]</tspan></text>
  <text class="body" x="60" y="124">RootLayout() &#8212; root HTML shell</text>
  <text class="body" x="60" y="140">&amp; page metadata. Wraps every</text>
  <text class="body" x="60" y="156">page in &lt;html&gt;/&lt;body&gt;.</text>

  <text class="bold mono" x="340" y="108">page.tsx <tspan class="client tag">[view + controller]</tspan></text>
  <text class="body" x="340" y="124">submit() posts a new regime;</text>
  <text class="body" x="340" y="140">loadById()/lookup() GET one by</text>
  <text class="body" x="340" y="156">id; save() PUTs edited doses.</text>
  <text class="body" x="340" y="172">Renders the list as cards (view).</text>

  <text class="bold mono" x="800" y="108">lib/api.ts</text>
  <text class="body" x="800" y="124">createRegime(), getRegimeById(),</text>
  <text class="body" x="800" y="140">updateRegime() &#8212; fetch wrappers</text>
  <text class="body" x="800" y="156">page.tsx calls; throw the server's</text>
  <text class="body" x="800" y="172">own error message on failure.</text>

  <!-- request / response pipe: all four routes -->
  <text class="pipe-tag mono" x="460" y="236" text-anchor="middle">REQUEST</text>
  <text class="pipe-code mono" x="460" y="252" text-anchor="middle">POST /api/regimes {muscle}</text>
  <text class="pipe-code mono" x="460" y="268" text-anchor="middle">GET &#183; DELETE /api/regimes/:id</text>
  <text class="pipe-code mono" x="460" y="284" text-anchor="middle">PUT /api/regimes/:id {regime:[&#8230;]}</text>
  <text class="arrow" x="460" y="310" text-anchor="middle">&#8595;</text>

  <text class="pipe-tag mono" x="770" y="236" text-anchor="middle">RESPONSE</text>
  <text class="pipe-code mono" x="770" y="252" text-anchor="middle">201 &#183; 200 {id, &#8230;, updatedAt, regime}</text>
  <text class="pipe-code mono" x="770" y="268" text-anchor="middle">204 no content &#8212; delete</text>
  <text class="pipe-code mono" x="770" y="284" text-anchor="middle">400 bad request &#183; 404 not found</text>
  <text class="arrow" x="770" y="310" text-anchor="middle">&#8593;</text>

  <!-- DATABASE -->
  <rect class="box" x="40" y="330" width="280" height="354" rx="2"/>
  <text class="title db mono" x="60" y="352">database</text>
  <text class="sub mono" x="300" y="352" text-anchor="end">postgres / supabase</text>
  <line class="div" x1="40" y1="362" x2="320" y2="362"/>

  <text class="bold mono" x="60" y="380">exercises</text>
  <text class="body" x="60" y="396">id (slug pk), name,</text>
  <text class="body" x="60" y="412">primary_muscles[] (gin),</text>
  <text class="body" x="60" y="428">instructions[], category, level.</text>
  <line class="div" x1="40" y1="440" x2="320" y2="440"/>

  <text class="bold mono" x="60" y="458">regimes</text>
  <text class="body" x="60" y="474">id (uuid), muscle, body_region,</text>
  <text class="body" x="60" y="490">created_at, updated_at.</text>
  <line class="div" x1="40" y1="502" x2="320" y2="502"/>

  <text class="bold mono" x="60" y="520">regime_exercises</text>
  <text class="body" x="60" y="536">regime_id + position (pk),</text>
  <text class="body" x="60" y="552">exercise_id (no fk &#8212; snapshot),</text>
  <text class="body" x="60" y="568">name, description, sets, reps.</text>
  <line class="div" x1="40" y1="584" x2="320" y2="584"/>

  <text class="bold mono" x="60" y="602">region_muscles</text>
  <text class="body" x="60" y="618">region (text pk), muscles[] (gin)</text>
  <text class="body" x="60" y="634">&#8212; the region&#8594;muscle mapping.</text>
  <text class="body" x="60" y="650">Read once, cached in-process.</text>

  <!-- connector: db <-> server -->
  <text class="arrow" x="350" y="408" text-anchor="middle">&#8592;</text>
  <text class="conn-label mono" x="350" y="424" text-anchor="middle">region_muscles,</text>
  <text class="conn-label mono" x="350" y="436" text-anchor="middle">muscle-array query</text>
  <text class="arrow" x="350" y="456" text-anchor="middle">&#8594;</text>
  <text class="conn-label mono" x="350" y="472" text-anchor="middle">candidates</text>

  <text class="arrow" x="350" y="526" text-anchor="middle">&#8594;</text>
  <text class="conn-label mono" x="350" y="542" text-anchor="middle">insert, replace,</text>
  <text class="conn-label mono" x="350" y="554" text-anchor="middle">delete (cascades)</text>
  <text class="arrow" x="350" y="574" text-anchor="middle">&#8592;</text>
  <text class="conn-label mono" x="350" y="590" text-anchor="middle">select (lookup)</text>

  <!-- SERVER -->
  <rect class="box" x="380" y="330" width="400" height="492" rx="2"/>
  <text class="title server mono" x="400" y="352">apps/server</text>
  <text class="sub mono" x="760" y="352" text-anchor="end">express &#183; :4000</text>
  <line class="div" x1="380" y1="362" x2="780" y2="362"/>

  <text class="bold mono" x="400" y="380">app.ts <tspan class="server tag">[middleware]</tspan></text>
  <text class="body" x="400" y="396">CORS + JSON body parsing; mounts</text>
  <text class="body" x="400" y="412">/api/regimes; 404 + handleError().</text>
  <line class="div" x1="380" y1="428" x2="780" y2="428"/>

  <text class="bold mono" x="400" y="446">controllers/regimes.ts <tspan class="server tag">[controller]</tspan></text>
  <text class="body" x="400" y="462">router.post() &#8594; create(); router.get()/</text>
  <text class="body" x="400" y="478">put()/delete() on /:id &#8594; get(), update(),</text>
  <text class="body" x="400" y="494">remove(). parseItems() validates PUT.</text>
  <line class="div" x1="380" y1="510" x2="780" y2="510"/>

  <text class="bold mono" x="400" y="528">models/regimes.ts <tspan class="db tag">[model]</tspan></text>
  <text class="body" x="400" y="544">create() &#8212; candidates + Gemini</text>
  <text class="body" x="400" y="560">picks, saved via insertItems().</text>
  <text class="body" x="400" y="576">get() reads via readItems().</text>
  <text class="body" x="400" y="592">update() replaces rows; resolveItems()</text>
  <text class="body" x="400" y="608">fills in name/description.</text>
  <text class="body" x="400" y="624">remove() deletes; items cascade.</text>
  <line class="div" x1="380" y1="640" x2="780" y2="640"/>

  <text class="bold mono" x="400" y="658">models/exercises.ts <tspan class="db tag">[model]</tspan></text>
  <text class="body" x="400" y="674">getByRegion() &#8212; matchRegion() maps</text>
  <text class="body" x="400" y="690">text to a region via getRegionMuscles()</text>
  <text class="body" x="400" y="706">(cached), queries primary_muscles &amp;&amp;.</text>
  <text class="body" x="400" y="722">getByIds() &#8212; cached catalogue lookup.</text>
  <line class="div" x1="380" y1="738" x2="780" y2="738"/>

  <text class="bold mono" x="400" y="756">models/gemini.ts <tspan class="db tag">[model]</tspan></text>
  <text class="body" x="400" y="772">pickExercises() &#8212; asks for 3 picks</text>
  <text class="body" x="400" y="788">+ sets/reps; drops any invented id.</text>

  <!-- connector: server <-> gemini (create path only) -->
  <text class="arrow" x="810" y="408" text-anchor="middle">&#8594;</text>
  <text class="conn-label mono" x="810" y="424" text-anchor="middle">candidates</text>
  <text class="conn-label mono" x="810" y="436" text-anchor="middle">+ prompt</text>
  <text class="arrow" x="810" y="456" text-anchor="middle">&#8592;</text>
  <text class="conn-label mono" x="810" y="472" text-anchor="middle">picks[]</text>

  <!-- GEMINI -->
  <rect class="box" x="840" y="330" width="280" height="270" rx="2"/>
  <text class="title ai mono" x="860" y="352">gemini</text>
  <text class="sub mono" x="1100" y="352" text-anchor="end">gemini-3.7-flash</text>
  <line class="div" x1="840" y1="362" x2="1120" y2="362"/>
  <text class="body" x="860" y="384">Picks exactly 3 exercises from</text>
  <text class="body" x="860" y="400">the shortlist it's given and</text>
  <text class="body" x="860" y="416">assigns sets/reps, forced into</text>
  <text class="body" x="860" y="432">a strict JSON schema &#8212; it can't</text>
  <text class="body" x="860" y="448">invent an exercise.</text>
  <line class="div" x1="840" y1="460" x2="1120" y2="460"/>
  <text class="body" x="860" y="478">Reached only by create().</text>
  <text class="body" x="860" y="494">get(), update() and remove()</text>
  <text class="body" x="860" y="510">work on the saved snapshot</text>
  <text class="body" x="860" y="526">and never call it.</text>
</svg>
