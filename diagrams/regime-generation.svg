  <path d="M 1195 1045 l -9 -4.5 l 0 9 z" fill="#9A6A2C"/>
  <text x="790" y="1061" class="sub" text-anchor="middle">another account's id → 404</text>
  <text x="790" y="1086" class="label" fill="#9A6A2C" text-anchor="middle">answers + note + screening</text>
  <line x1="1195" y1="1095" x2="389" y2="1095" stroke="#9A6A2C" stroke-width="1.3" stroke-dasharray="5 4"/>
