name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
        run: pnpm --filter web run build

  # check:rls needs a real database, so it runs only where DATABASE_URL is
  # available. It must FAIL, not skip, when the secret is missing on a run that
  # should have had it: v1's cross-user isolation test self-skipped without
  # credentials, the secret was never added, and CI reported green for the whole
  # project without ever proving isolation.
  rls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fail if DATABASE_URL is absent
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is not set. check:rls cannot run."
            echo "This fails deliberately rather than skipping - see CONTRIBUTING.md."
            exit 1
          fi

      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm --filter @rebound/api run db:migrate

      - name: Check RLS decisions
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm --filter @rebound/api run check:rls

  # Same reasoning as the rls job above, for the cross-user isolation test:
  # it needs a live database and a live rebound_restricted connection, and it
  # must fail rather than skip if either secret is missing.
  isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fail if RESTRICTED_DATABASE_URL is absent
        env:
          RESTRICTED_DATABASE_URL: ${{ secrets.RESTRICTED_DATABASE_URL }}
        run: |
          if [ -z "$RESTRICTED_DATABASE_URL" ]; then
            echo "RESTRICTED_DATABASE_URL secret is not set. The isolation test cannot run."
            echo "This fails deliberately rather than skipping - see CONTRIBUTING.md."
            exit 1
          fi

      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm --filter @rebound/api run db:migrate

      - name: Cross-user RLS isolation test
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RESTRICTED_DATABASE_URL: ${{ secrets.RESTRICTED_DATABASE_URL }}
        run: pnpm --filter @rebound/api run test:isolation
