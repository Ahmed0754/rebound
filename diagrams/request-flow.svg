<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 804" role="img" aria-label="Rebound architecture: the client's page.tsx POSTs a muscle name to create a regime, or GETs, PUTs and DELETEs one by id. The controller validates each request and routes it to models/regimes.ts, which for create asks the exercises model to query Postgres for candidates and Gemini to pick three with sets and reps, then saves the regime and its items in one transaction. Lookup reads that saved snapshot straight back out, update replaces the saved exercises in a transaction and resolves their names server-side, and delete removes the regime, with its items cascading. Neither lookup, update nor delete calls Gemini. Boxes are tagged with their MVC role: view, controller, or model.">
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono       { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .bg         { fill: #121210; }
    .box        { fill: none; stroke: #EBE9DC; stroke-width: 1.5; }
    .div        { stroke: #38372F; stroke-width: 1; }
    .title      { font-weight: 700; font-size: 14px; fill: #EBE9DC; }
    .sub        { font-size: 10.5px; fill: #7A786C; }
    .body       { font-size: 11px; fill: #A9A79A; }
    .bold       { font-weight: 700; fill: #EBE9DC; }
    .tag        { font-weight: 600; font-size: 10.5px; }
    .legend     { font-size: 11px; fill: #A9A79A; }
    .arrow      { font-size: 20px; fill: #EBE9DC; }
    .conn-label { font-size: 9.5px; fill: #A9A79A; }
    .pipe-tag   { font-size: 9.5px; letter-spacing: 1px; fill: #7A786C; }
    .pipe-code  { font-size: 11px; fill: #EBE9DC; }
    .client { fill: #8C99F2; }
    .server { fill: #4FBBA8; }
    .db     { fill: #D290C6; }
    .ai     { fill: #E08B5F; }
  </style>

  <rect class="bg" x="0" y="0" width="1160" height="804"/>

  <!-- legend -->
  <text class="legend mono" x="40" y="30">mvc <tspan class="client tag">[view]</tspan> client-side ui  &#183;  <tspan class="server tag">[controller]</tspan> routing &amp; validation  &#183;  <tspan class="db tag">[model]</tspan> business logic &amp; data access</text>
  <line class="div" x1="40" y1="44" x2="1120" y2="44"/>

  <!-- CLIENT -->
  <rect class="box" x="40" y="54" width="1080" height="134" rx="2"/>
  <text class="title client mono" x="60" y="74">apps/client &#8212; next.js</text>
  <text class="sub mono" x="1100" y="74" text-anchor="end">localhost:3000</text>
  <line class="div" x1="40" y1="86" x2="1120" y2="86" stroke="#EBE9DC" stroke-width="1.5"/>
  <line class="div" x1="560" y1="86" x2="560" y2="188"/>

  <text class="bold mono" x="60" y="108">layout.tsx <tspan class="client tag">[view]</tspan></text>
  <text class="body" x="60" y="124">Root HTML shell &amp; page metadata</text>
  <text class="body" x="60" y="140">&#8212; wraps every page.</text>

  <text class="bold mono" x="600" y="108">page.tsx <tspan class="client tag">[view + controller]</tspan></text>
  <text class="body" x="600" y="124">submit() posts a new regime; a</text>
  <text class="body" x="600" y="140">second box looks one up by id</text>
  <text class="body" x="600" y="156">(controller). Renders cards (view).</text>

  <!-- request / response pipe: all four routes -->
  <text class="pipe-tag mono" x="460" y="204" text-anchor="middle">REQUEST</text>
  <text class="pipe-code mono" x="460" y="220" text-anchor="middle">POST /api/regimes {muscle}</text>
  <text class="pipe-code mono" x="460" y="236" text-anchor="middle">GET &#183; DELETE /api/regimes/:id</text>
  <text class="pipe-code mono" x="460" y="252" text-anchor="middle">PUT /api/regimes/:id {regime:[&#8230;]}</text>
  <text class="arrow" x="460" y="278" text-anchor="middle">&#8595;</text>

  <text class="pipe-tag mono" x="770" y="204" text-anchor="middle">RESPONSE</text>
  <text class="pipe-code mono" x="770" y="220" text-anchor="middle">201 &#183; 200 {id, &#8230;, updatedAt, regime}</text>
  <text class="pipe-code mono" x="770" y="236" text-anchor="middle">204 no content &#8212; delete</text>
  <text class="pipe-code mono" x="770" y="252" text-anchor="middle">400 bad request &#183; 404 not found</text>
  <text class="arrow" x="770" y="278" text-anchor="middle">&#8593;</text>

  <!-- DATABASE -->
  <rect class="box" x="40" y="298" width="280" height="270" rx="2"/>
  <text class="title db mono" x="60" y="320">database</text>
  <text class="sub mono" x="300" y="320" text-anchor="end">postgres / supabase</text>
  <line class="div" x1="40" y1="330" x2="320" y2="330"/>

  <text class="bold mono" x="60" y="348">exercises</text>
  <text class="body" x="60" y="364">id (slug pk), name,</text>
  <text class="body" x="60" y="380">primary_muscles[] (gin),</text>
  <text class="body" x="60" y="396">instructions[], category, level.</text>
  <line class="div" x1="40" y1="408" x2="320" y2="408"/>

  <text class="bold mono" x="60" y="426">regimes</text>
  <text class="body" x="60" y="442">id (uuid), muscle, body_region,</text>
  <text class="body" x="60" y="458">created_at, updated_at.</text>
  <line class="div" x1="40" y1="470" x2="320" y2="470"/>

  <text class="bold mono" x="60" y="488">regime_exercises</text>
  <text class="body" x="60" y="504">regime_id + position (pk),</text>
  <text class="body" x="60" y="520">exercise_id (no fk &#8212; snapshot),</text>
  <text class="body" x="60" y="536">name, description, sets, reps.</text>

  <!-- connector: db <-> server -->
  <text class="arrow" x="350" y="376" text-anchor="middle">&#8592;</text>
  <text class="conn-label mono" x="350" y="392" text-anchor="middle">muscle-array query</text>
  <text class="arrow" x="350" y="424" text-anchor="middle">&#8594;</text>
  <text class="conn-label mono" x="350" y="440" text-anchor="middle">candidates</text>

  <text class="arrow" x="350" y="494" text-anchor="middle">&#8594;</text>
  <text class="conn-label mono" x="350" y="510" text-anchor="middle">insert, replace,</text>
  <text class="conn-label mono" x="350" y="522" text-anchor="middle">delete (cascades)</text>
  <text class="arrow" x="350" y="542" text-anchor="middle">&#8592;</text>
  <text class="conn-label mono" x="350" y="558" text-anchor="middle">select (lookup)</text>

  <!-- SERVER -->
  <rect class="box" x="380" y="298" width="400" height="454" rx="2"/>
  <text class="title server mono" x="400" y="320">apps/server</text>
  <text class="sub mono" x="760" y="320" text-anchor="end">express &#183; :4000</text>
  <line class="div" x1="380" y1="330" x2="780" y2="330"/>

  <text class="bold mono" x="400" y="348">app.ts <tspan class="server tag">[middleware]</tspan></text>
  <text class="body" x="400" y="364">CORS + JSON body parsing, mounts</text>
  <text class="body" x="400" y="380">/api/regimes, 404 + error handler.</text>
  <line class="div" x1="380" y1="392" x2="780" y2="392"/>

  <text class="bold mono" x="400" y="410">controllers/regimes.ts <tspan class="server tag">[controller]</tspan></text>
  <text class="body" x="400" y="426">Router: POST / &#8594; create(); on /:id,</text>
  <text class="body" x="400" y="442">GET &#8594; get(), PUT &#8594; update(),</text>
  <text class="body" x="400" y="458">DELETE &#8594; remove(). Validates edits.</text>
  <line class="div" x1="380" y1="470" x2="780" y2="470"/>

  <text class="bold mono" x="400" y="488">models/regimes.ts <tspan class="db tag">[model]</tspan></text>
  <text class="body" x="400" y="504">create() &#8212; candidates + Gemini</text>
  <text class="body" x="400" y="520">picks, inserted in one transaction.</text>
  <text class="body" x="400" y="536">get() &#8212; reads the saved snapshot.</text>
  <text class="body" x="400" y="552">update() &#8212; replaces the exercises;</text>
  <text class="body" x="400" y="568">name/description resolved here.</text>
  <text class="body" x="400" y="584">remove() &#8212; delete; items cascade.</text>
  <line class="div" x1="380" y1="596" x2="780" y2="596"/>

  <text class="bold mono" x="400" y="614">models/exercises.ts <tspan class="db tag">[model]</tspan></text>
  <text class="body" x="400" y="630">getByRegion() &#8212; maps text to a</text>
  <text class="body" x="400" y="646">region, queries primary_muscles &amp;&amp;.</text>
  <text class="body" x="400" y="662">getByIds() &#8212; names an added exercise.</text>
  <line class="div" x1="380" y1="674" x2="780" y2="674"/>

  <text class="bold mono" x="400" y="692">models/gemini.ts <tspan class="db tag">[model]</tspan></text>
  <text class="body" x="400" y="708">pickExercises() &#8212; asks for 3 picks</text>
  <text class="body" x="400" y="724">+ sets/reps; drops any invented id.</text>

  <!-- connector: server <-> gemini (create path only) -->
  <text class="arrow" x="810" y="376" text-anchor="middle">&#8594;</text>
  <text class="conn-label mono" x="810" y="392" text-anchor="middle">candidates</text>
  <text class="conn-label mono" x="810" y="404" text-anchor="middle">+ prompt</text>
  <text class="arrow" x="810" y="424" text-anchor="middle">&#8592;</text>
  <text class="conn-label mono" x="810" y="440" text-anchor="middle">picks[]</text>

  <!-- GEMINI -->
  <rect class="box" x="840" y="298" width="280" height="270" rx="2"/>
  <text class="title ai mono" x="860" y="320">gemini</text>
  <text class="sub mono" x="1100" y="320" text-anchor="end">gemini-3.7-flash</text>
  <line class="div" x1="840" y1="330" x2="1120" y2="330"/>
  <text class="body" x="860" y="352">Picks exactly 3 exercises from</text>
  <text class="body" x="860" y="368">the shortlist it's given and</text>
  <text class="body" x="860" y="384">assigns sets/reps, forced into</text>
  <text class="body" x="860" y="400">a strict JSON schema &#8212; it can't</text>
  <text class="body" x="860" y="416">invent an exercise.</text>
  <line class="div" x1="840" y1="428" x2="1120" y2="428"/>
  <text class="body" x="860" y="446">Reached only by create().</text>
  <text class="body" x="860" y="462">get(), update() and remove()</text>
  <text class="body" x="860" y="478">work on the saved snapshot</text>
  <text class="body" x="860" y="494">and never call it.</text>
</svg>
