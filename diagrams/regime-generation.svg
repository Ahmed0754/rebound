<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 2062" width="1300" height="2062" role="img" aria-labelledby="t d">
  <title id="t">Regime generation</title>
  <desc id="d">Sequence diagram of how a Rebound plan is made. Part one: the browser posts the questionnaire; the API validates it, checks the region against region_muscles, runs the fixed crisis patterns, screens any note with a Gemini classifier, saves the response, and returns an outcome of ready, see a doctor, or crisis. Part two: the browser posts the onboarding id; the API reloads the answers, re-runs the decision, computes limits from nine stacking caps, and fetches up to twenty random candidates. It then loops for up to twenty seconds and five attempts: Gemini proposes a plan, hard checks (validateRegime and checkRationales) reject anything outside the limits or claiming to cure, and quality checks from quality.ts compare it to ten sourced criteria, retrying on a miss. The best plan that passed the hard checks is saved with its limits and quality record in one transaction, or the request is refused with a 503.</desc>
  <style>
    text { font-family: ui-monospace, "JetBrains Mono", SFMono-Regular, Menlo, Consolas, monospace; }
    .bg { fill: #FBFBF9; }
    .head { fill: #EEF0F4; stroke: #D5D9E2; }
    .headtext { font-size: 12.5px; font-weight: 600; fill: #2B2F38; }
    .life { stroke: #C9CCD3; stroke-width: 1; stroke-dasharray: 4 5; }
    .banner { font-size: 11px; font-weight: 700; letter-spacing: 1.2px; fill: #5A5F6B; }
    .rule { stroke: #E2E4E9; }
    .label { font-size: 12px; font-weight: 600; }
    .sub { font-size: 10.5px; fill: #6E7380; }
    .note { fill: #FFFFFF; stroke: #D3D6DD; }
    .accent { stroke: #2B8584; stroke-width: 1.5; }
    .file { font-size: 10px; fill: #8A8F9B; }
    .name { font-size: 12.5px; font-weight: 700; fill: #22252C; }
    .loop { fill: #F1F3F7; stroke: #C5CAD4; stroke-dasharray: 5 4; }
    .looptitle { font-size: 10.5px; font-weight: 700; letter-spacing: 0.8px; fill: #4A4F5B; }
  </style>
  <rect width="1300" height="2062" class="bg"/>
  <rect x="265" y="1416" width="865" height="342" rx="9" class="loop"/>
  <text x="281" y="1435" class="looptitle">LOOP · UNTIL A PLAN PASSES BOTH TIERS · 20 s BUDGET · ≤ 5 ATTEMPTS · NONE STARTS WITH &lt; 4 s LEFT</text>
  <line x1="150" y1="58" x2="150" y2="2046" class="life"/>
  <line x1="385" y1="58" x2="385" y2="2046" class="life"/>
  <line x1="620" y1="58" x2="620" y2="2046" class="life"/>
  <line x1="840" y1="58" x2="840" y2="2046" class="life"/>
  <line x1="1020" y1="58" x2="1020" y2="2046" class="life"/>
  <line x1="1195" y1="58" x2="1195" y2="2046" class="life"/>
  <rect x="74.65" y="20" width="150.7" height="30" rx="6" class="head"/><text x="150" y="40" class="headtext" text-anchor="middle">Browser · Next.js</text>
  <rect x="330.95" y="20" width="108.1" height="30" rx="6" class="head"/><text x="385" y="40" class="headtext" text-anchor="middle">Express API</text>
  <rect x="526.9" y="20" width="186.2" height="30" rx="6" class="head"/><text x="620" y="40" class="headtext" text-anchor="middle">Rules · pure functions</text>
  <rect x="757.55" y="20" width="164.9" height="30" rx="6" class="head"/><text x="840" y="40" class="headtext" text-anchor="middle">Gemini · classifier</text>
  <rect x="941.1" y="20" width="157.8" height="30" rx="6" class="head"/><text x="1020" y="40" class="headtext" text-anchor="middle">Gemini · generator</text>
  <rect x="1112.55" y="20" width="164.9" height="30" rx="6" class="head"/><text x="1195" y="40" class="headtext" text-anchor="middle">Postgres · Supabase</text>
  <text x="24" y="112" class="banner">1 · SUBMIT THE QUESTIONNAIRE</text>
  <line x1="24" y1="120" x2="1276" y2="120" class="rule"/>
  <rect x="17.05000000000001" y="146" width="265.9" height="58" rx="7" class="note"/>
  <text x="150" y="162" class="file" text-anchor="middle">app/onboarding</text>
  <text x="150" y="179" class="name" text-anchor="middle">answer four steps</text>
  <text x="150" y="195" class="sub" text-anchor="middle">region · pain · red flags · gear · note</text>
  <text x="267.5" y="226" class="label" fill="#A3286A" text-anchor="middle">POST /api/onboarding</text>
  <line x1="150" y1="235" x2="381" y2="235" stroke="#A3286A" stroke-width="1.8"/>
  <path d="M 385 235 l -9 -4.5 l 0 9 z" fill="#A3286A"/>
  <text x="267.5" y="251" class="sub" text-anchor="middle">answers + freeText · X-User-Id</text>
  <rect x="242.9" y="276" width="284.2" height="58" rx="7" class="note"/>
  <text x="385" y="292" class="file" text-anchor="middle">controllers/onboarding.ts</text>
  <text x="385" y="309" class="name" text-anchor="middle">parseAnswers() · parseFreeText()</text>
  <text x="385" y="325" class="sub" text-anchor="middle">a bad value → 400, naming the allowed ones</text>
  <text x="790" y="356" class="label" fill="#9A6A2C" text-anchor="middle">listRegions()</text>
  <line x1="385" y1="365" x2="1191" y2="365" stroke="#9A6A2C" stroke-width="1.8"/>
  <path d="M 1195 365 l -9 -4.5 l 0 9 z" fill="#9A6A2C"/>
