services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rebound
      POSTGRES_PASSWORD: rebound
      POSTGRES_DB: rebound
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rebound"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Overrides the host-oriented DATABASE_URL in .env: inside the compose
      # network the database is reachable as "postgres", not "localhost".
      DATABASE_URL: "postgresql://rebound:rebound@postgres:5432/rebound"
    ports:
      - "3000:3000"

volumes:
  postgres_data:
