  <line x1="1020" y1="1523" x2="389" y2="1523" stroke="#2B8584" stroke-width="1.3" stroke-dasharray="5 4"/>
  <path d="M 385 1523 l 9 -4.5 l 0 9 z" fill="#2B8584"/>
  <text x="702.5" y="1539" class="sub" text-anchor="middle">JSON schema · timeout = min(20 s, time left)</text>
  <text x="399" y="1564" class="label" fill="#4E7A35" text-anchor="start">validateRegime() + checkRationales()</text>
  <line x1="385" y1="1573" x2="616" y2="1573" stroke="#4E7A35" stroke-width="1.8"/>
  <path d="M 620 1573 l -9 -4.5 l 0 9 z" fill="#4E7A35"/>
  <text x="399" y="1589" class="sub" text-anchor="start">HARD · doses inside limits · ids offered · no pain or cure claims</text>
  <text x="399" y="1614" class="label" fill="#4E7A35" text-anchor="start">problems[]</text>
  <line x1="620" y1="1623" x2="389" y2="1623" stroke="#4E7A35" stroke-width="1.3" stroke-dasharray="5 4"/>
  <path d="M 385 1623 l 9 -4.5 l 0 9 z" fill="#4E7A35"/>
  <text x="399" y="1639" class="sub" text-anchor="start">any → retry, told every problem · never saved</text>
  <text x="399" y="1664" class="label" fill="#4E7A35" text-anchor="start">checkQuality(plan, candidates)</text>
  <line x1="385" y1="1673" x2="616" y2="1673" stroke="#4E7A35" stroke-width="1.8"/>
  <path d="M 620 1673 l -9 -4.5 l 0 9 z" fill="#4E7A35"/>
  <text x="399" y="1689" class="sub" text-anchor="start">QUALITY · quality.ts · 10 criteria from AAOS / APTA</text>
  <text x="399" y="1714" class="label" fill="#4E7A35" text-anchor="start">met · missed · n/a · unsatisfiable</text>
  <line x1="620" y1="1723" x2="389" y2="1723" stroke="#4E7A35" stroke-width="1.3" stroke-dasharray="5 4"/>
  <path d="M 385 1723 l 9 -4.5 l 0 9 z" fill="#4E7A35"/>
  <text x="399" y="1739" class="sub" text-anchor="start">keep the best so far · a miss → retry with asksFor()</text>
  <rect x="224.60000000000002" y="1782" width="320.79999999999995" height="58" rx="7" class="note accent"/>
  <text x="385" y="1798" class="file" text-anchor="middle">models/regimes.ts</text>
  <text x="385" y="1815" class="name" text-anchor="middle">generate() → the best plan</text>
  <text x="385" y="1831" class="sub" text-anchor="middle">none passed the hard checks → 503, nothing saved</text>
  <text x="790" y="1862" class="label" fill="#9A6A2C" text-anchor="middle">insert regimes + regime_exercises</text>
  <line x1="385" y1="1871" x2="1191" y2="1871" stroke="#9A6A2C" stroke-width="1.8"/>
  <path d="M 1195 1871 l -9 -4.5 l 0 9 z" fill="#9A6A2C"/>
  <text x="790" y="1887" class="sub" text-anchor="middle">one transaction · limits + quality jsonb</text>
  <text x="267.5" y="1912" class="label" fill="#A3286A" text-anchor="middle">201 plan</text>
  <line x1="385" y1="1921" x2="154" y2="1921" stroke="#A3286A" stroke-width="1.3" stroke-dasharray="5 4"/>
  <path d="M 150 1921 l 9 -4.5 l 0 9 z" fill="#A3286A"/>
  <text x="267.5" y="1937" class="sub" text-anchor="middle">quality is stored, not returned</text>
  <rect x="14" y="1962" width="284.2" height="58" rx="7" class="note"/>
  <text x="156.1" y="1978" class="file" text-anchor="middle">app/plans/[id]</text>
  <text x="156.1" y="1995" class="name" text-anchor="middle">plan page</text>
