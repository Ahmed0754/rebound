  <line x1="1195" y1="415" x2="389" y2="415" stroke="#9A6A2C" stroke-width="1.3" stroke-dasharray="5 4"/>
  <path d="M 385 415 l 9 -4.5 l 0 9 z" fill="#9A6A2C"/>
  <text x="790" y="431" class="sub" text-anchor="middle">region has to match one exactly</text>
  <text x="502.5" y="456" class="label" fill="#4E7A35" text-anchor="middle">isCrisisText(note)</text>
  <line x1="385" y1="465" x2="616" y2="465" stroke="#4E7A35" stroke-width="1.8"/>
  <path d="M 620 465 l -9 -4.5 l 0 9 z" fill="#4E7A35"/>
  <text x="502.5" y="481" class="sub" text-anchor="middle">fixed patterns · no model</text>
  <text x="502.5" y="506" class="label" fill="#4E7A35" text-anchor="middle">crisis → stop</text>
  <line x1="620" y1="515" x2="389" y2="515" stroke="#4E7A35" stroke-width="1.3" stroke-dasharray="5 4"/>
  <path d="M 385 515 l 9 -4.5 l 0 9 z" fill="#4E7A35"/>
  <text x="502.5" y="531" class="sub" text-anchor="middle">no model call</text>
  <text x="612.5" y="556" class="label" fill="#4A55B5" text-anchor="middle">screenNote(note)</text>
  <line x1="385" y1="565" x2="836" y2="565" stroke="#4A55B5" stroke-width="1.8"/>
  <path d="M 840 565 l -9 -4.5 l 0 9 z" fill="#4A55B5"/>
  <text x="612.5" y="581" class="sub" text-anchor="middle">only if there is a note · temperature 0 · 2 tries</text>
  <text x="612.5" y="606" class="label" fill="#4A55B5" text-anchor="middle">clear · flagged · crisis</text>
  <line x1="840" y1="615" x2="389" y2="615" stroke="#4A55B5" stroke-width="1.3" stroke-dasharray="5 4"/>
  <path d="M 385 615 l 9 -4.5 l 0 9 z" fill="#4A55B5"/>
  <text x="612.5" y="631" class="sub" text-anchor="middle">unreachable → 'unavailable', let through (ADR 0021)</text>
  <text x="790" y="656" class="label" fill="#9A6A2C" text-anchor="middle">insert onboarding_responses</text>
  <line x1="385" y1="665" x2="1191" y2="665" stroke="#9A6A2C" stroke-width="1.8"/>
  <path d="M 1195 665 l -9 -4.5 l 0 9 z" fill="#9A6A2C"/>
  <text x="790" y="681" class="sub" text-anchor="middle">saved even when the answers turn someone away</text>
  <text x="502.5" y="706" class="label" fill="#4E7A35" text-anchor="middle">decide() · getLimits()</text>
  <line x1="385" y1="715" x2="616" y2="715" stroke="#4E7A35" stroke-width="1.8"/>
  <path d="M 620 715 l -9 -4.5 l 0 9 z" fill="#4E7A35"/>
  <text x="502.5" y="731" class="sub" text-anchor="middle">7 red flags + screening</text>
  <text x="399" y="756" class="label" fill="#4E7A35" text-anchor="start">ready · see_a_doctor · crisis</text>
  <line x1="620" y1="765" x2="389" y2="765" stroke="#4E7A35" stroke-width="1.3" stroke-dasharray="5 4"/>
  <path d="M 385 765 l 9 -4.5 l 0 9 z" fill="#4E7A35"/>
  <text x="399" y="781" class="sub" text-anchor="start">+ limits and their reasons, when ready</text>
  <text x="267.5" y="806" class="label" fill="#A3286A" text-anchor="middle">201 {id, outcome, …}</text>
  <line x1="385" y1="815" x2="154" y2="815" stroke="#A3286A" stroke-width="1.3" stroke-dasharray="5 4"/>
  <path d="M 150 815 l 9 -4.5 l 0 9 z" fill="#A3286A"/>
  <text x="267.5" y="831" class="sub" text-anchor="middle">branch on outcome, never the status</text>
  <rect x="14" y="856" width="326.9" height="58" rx="7" class="note"/>
  <text x="177.45" y="872" class="file" text-anchor="middle">app/onboarding/[id]</text>
  <text x="177.45" y="889" class="name" text-anchor="middle">outcome screen</text>
  <text x="177.45" y="905" class="sub" text-anchor="middle">crisis → 988 · doctor → referral · ready → limits</text>
  <text x="24" y="952" class="banner">2 · GENERATE THE PLAN</text>
  <line x1="24" y1="960" x2="1276" y2="960" class="rule"/>
  <text x="267.5" y="986" class="label" fill="#A3286A" text-anchor="middle">POST /api/regimes</text>
